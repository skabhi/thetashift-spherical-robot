site_name: ThetaShift Robot Handbook
site_description: Build, inspect and extend the ESP32 spherical robot firmware.
site_url: https://skabhi.github.io/thetashift-spherical-robot/
repo_url: https://github.com/skabhi/thetashift-spherical-robot
repo_name: skabhi/thetashift-spherical-robot
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
theme:
  name: material
  language: en
  font: false
  palette:
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
nav:
  - Introduction: README.md
  - Use the robot:
      - Install and connect: getting-started.md
      - Console tools: console-tools.md
      - Tasks and scheduling: tasks.md
      - Messages and extensions: messages.md
      - Trace and timeline: tracing.md
  - Maintain and extend:
      - Troubleshooting: troubleshooting.md
      - Tests and measurements: testing.md
      - Publishing documentation: publishing.md
  - Book contents: SUMMARY.md
